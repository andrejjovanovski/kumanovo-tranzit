    <style>
      /* Instant paint: set the app background before any bundle loads so there
         is no white flash, and show a branded splash until React mounts. */
      html, body { margin: 0; background: #f3f2f2; }
      #kt-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f2f2;
        transition: opacity 0.35s ease;
      }
      #kt-splash.kt-hide { opacity: 0; pointer-events: none; }
      .kt-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .kt-splash-logo {
        width: 76px;
        height: 76px;
        animation: kt-splash-pulse 1.4s ease-in-out infinite;
      }
      .kt-splash-word {
        font-family: "Montserrat", system-ui, sans-serif;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.06em;
        line-height: 1.15;
        text-align: center;
        color: #201e1d;
      }
      .kt-splash-word span { color: #dd2b0f; }
      @keyframes kt-splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .kt-splash-logo { animation: none; }
      }
    </style>
  </head>
