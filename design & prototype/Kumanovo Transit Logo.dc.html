<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="_ds/modernist-103182da-9152-42d3-b836-0e1d1e7d7d3a/styles.css">
  <script src="_ds/modernist-103182da-9152-42d3-b836-0e1d1e7d7d3a/_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
  </style>
</helmet>

<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;gap:64px;padding:64px 24px">

  <!-- primary horizontal lockup -->
  <div style="display:flex;align-items:center;gap:20px">
    <div style="width:88px;height:88px;flex:none;background:var(--color-accent-500);display:flex;align-items:center;justify-content:center">
      <i data-lucide="route" style="width:44px;height:44px;color:#fff;stroke-width:2.5"></i>
    </div>
    <div style="height:88px;display:flex;flex-direction:column;justify-content:center;gap:6px">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:33px;line-height:0.95;letter-spacing:-0.02em">КУМАНОВО<br /><span style="color:var(--color-accent-600)">ТРАНЗИТ</span></div>
      <div style="font-size:11px;line-height:1.1;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-neutral-700)">Јавен транспорт &middot; Public Transit</div>
    </div>
  </div>

  <div class="hr" style="width:100%;max-width:640px"></div>

  <!-- stacked lockup -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div style="width:64px;height:64px;flex:none;background:var(--color-accent-500);display:flex;align-items:center;justify-content:center">
      <i data-lucide="route" style="width:32px;height:32px;color:#fff;stroke-width:2.5"></i>
    </div>
    <div style="text-align:center">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.01em">КУМАНОВО <span style="color:var(--color-accent-600)">ТРАНЗИТ</span></div>
      <div style="font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--color-neutral-700);margin-top:4px">Јавен транспорт</div>
    </div>
  </div>

  <div class="hr" style="width:100%;max-width:640px"></div>

  <!-- icon mark alone, at a few sizes -->
  <div style="display:flex;align-items:center;gap:20px">
    <div style="width:96px;height:96px;flex:none;background:var(--color-accent-500);display:flex;align-items:center;justify-content:center">
      <i data-lucide="route" style="width:48px;height:48px;color:#fff;stroke-width:2.5"></i>
    </div>
    <div style="width:56px;height:56px;flex:none;background:var(--color-text);display:flex;align-items:center;justify-content:center">
      <i data-lucide="route" style="width:28px;height:28px;color:var(--color-bg);stroke-width:2.5"></i>
    </div>
    <div style="width:32px;height:32px;flex:none;background:var(--color-accent-500);display:flex;align-items:center;justify-content:center">
      <i data-lucide="route" style="width:17px;height:17px;color:#fff;stroke-width:2.5"></i>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { if (window.lucide) window.lucide.createIcons(); }
  componentDidUpdate() { if (window.lucide) window.lucide.createIcons(); }
  renderVals() { return {}; }
}

</script>
</body>
</html>
